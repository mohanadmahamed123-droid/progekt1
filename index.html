
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إلى ضحى ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #160b20, #51152f, #170b27);
    color: white;
    font-family: Tahoma, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

.container {
    padding: 50px 20px;
    position: relative;
    z-index: 2;
}

h1 {
    color: #ff8eb5;
    font-size: 48px;
    margin: 20px;
    text-shadow: 0 0 20px #ff397c;
}

.heart {
    font-size: 100px;
    animation: beat 1s infinite;
    margin: 20px;
    text-shadow: 0 0 30px #ff174f;
}

@keyframes beat {
    50% { transform: scale(1.2); }
}

.letter {
    font-size: 90px;
    color: #ff5c9a;
    text-shadow: 0 0 30px #ff176b;
    margin: 15px;
}

.poem {
    max-width: 600px;
    margin: 20px auto;
    padding: 25px;
    background: #ffffff12;
    border: 1px solid #ff82ae66;
    border-radius: 20px;
    line-height: 2.2;
    font-size: 19px;
    box-shadow: 0 0 25px #ff397c33;
}

button {
    background: #ff397c;
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    margin: 20px;
}

button:hover {
    background: #ff75a5;
    transform: scale(1.05);
}

.floating {
    position: fixed;
    bottom: -30px;
    color: #ff7ba9;
    animation: rise 7s linear infinite;
    z-index: 1;
    pointer-events: none;
}

@keyframes rise {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

#message {
    display: none;
    font-size: 21px;
    color: #ffb4ce;
    margin: 20px;
}
</style>
</head>

<body>

<div class="container">

    <h1>إلى ضُحى ❤️</h1>

    <div class="heart">♥</div>

    <div class="letter">D</div>

    <h2>هناك أشخاص لا يشبهون أحداً...</h2>

    <div class="poem">
        يا ضُحى، يا زهرةً بين النجوم 🌹<br>
        ويا حلماً جميلاً لا يغيب<br>
        لكِ في القلب حكاية لا تنتهي<br>
        وفي حضورك يصبح العالم أجمل<br>
        أنتِ قصيدة لا تكفيها الكلمات ❤️
    </div>

    <button onclick="showLove()">
        اضغطي هنا ❤️
    </button>

    <div id="message">
        ضُحى، أنتِ حكاية جميلة كتبتها الصدفة ❤️
    </div>

    <p style="margin-top:35px;color:#ff9fbd;">
        صُنعت بكل الحب ♡
    </p>

</div>

<script>
function showLove() {
    document.getElementById("message").style.display = "block";
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "floating";
    heart.innerHTML = "♥";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 30) + "px";
    heart.style.animationDuration = (4 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 9000);
}

setInterval(createHeart, 400);
</script>

</body>
</html>
